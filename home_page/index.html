<html lang="en"> 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style type="text/css">
        .my_cover
        {
            width:100%;
            height:300px;
            object-fit:cover;
        }

        .container
        {
            width:100%;
            height:300px;
            position:relative;
        }

        .container a
        {
            position:absolute;
            left:50%;
            top:50%;
            transform:tranlsate(-50%, -50%);
            color:white;
            text-decoration:none;
            font-size:26px;
        }
    </style>
</head>
<body>
    <h1>Heading</h1>
    <div class="container">
        <a href="">Title</a>
        <img class="my_cover" src="/banner.jpg" alt="info about image for screen readers or when image doesnt load">
    </div>
    <div>
        <button>click me</button>
        <br>
        <a href="https://www.youtube.com/watch?v=vY2xUc4TVmY&t=219s" target="_blank">Link Name</a> <!--rel=--> <!--absolute link-->
